[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 88
src = ["."]
exclude = [
  "alembic/versions/",
  ".venv",
  ".git",
  ".idea",
  ".vscode",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
