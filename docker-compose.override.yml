services:
  backend:
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && fastapi dev app/main.py --host 0.0.0.0"

  frontend:
    build:
      context: ./frontend
      target: builder
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
      TURBOPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
