[pr_reviewer]
extra_instructions = """
Проект: FastAPI (backend/) + Next.js FSD (frontend/). Отвечай на русском.
Проверяй правила проекта:
- Слои бэка: routers -> services -> queries. В роутерах не должно быть select/SQL и бизнес-логики.
- Функции в queries/ не делают commit (кроме простых однооперационных) — commit принадлежит сервису.
- Все datetime — timezone-aware (DateTime(timezone=True), datetime.now(timezone.utc)). Naive datetime — ошибка.
- Никаких deprecated API: pydantic v1 class Config, @app.on_event, .eslintrc.
- PATCH-эндпоинты обязаны использовать model_dump(exclude_unset=True).
- user_id всегда из CurrentUser, никогда из тела запроса.
- FSD на фронте: импорты только вниз (app->widgets->features->entities->shared),
  импорт мимо index.ts слайса — нарушение, фича не импортирует фичу.
- Токены не должны попадать в localStorage; запросы к API — через shared/api.
- Если менялись модели SQLAlchemy — в PR должна быть alembic-миграция.
"""

[pr_code_suggestions]
extra_instructions = "Предлагай улучшения с учётом правил выше. Отвечай на русском."
num_code_suggestions = 4

[pr_description]
enable_pr_diagram = true  
enable_semantic_files_types = true
generate_ai_title = true
use_description_markers = true 
extra_instructions = "Пиши на русском. Кратко: что меняет PR и зачем."
enable_custom_labels = true

[custom_labels."area:backend"]
description = "pr_agent:Добавляй, если PR изменяет backend/ (FastAPI, SQLAlchemy, миграции)"
[custom_labels."area:frontend"]
description = "pr_agent:Добавляй, если PR изменяет frontend/ (Next.js, FSD, компоненты)"
[custom_labels."area:infra"]
description = "pr_agent:Добавляй, если PR изменяет CI, Docker, workflows или конфиги"
[custom_labels."area:docs"]
description = "pr_agent:Добавляй, если PR изменяет docs/ или README"

[custom_labels."bug-fix"]
description = "pr_agent:Добавляй, если PR исправляет некорректное поведение или баг"
[custom_labels."feature"]
description = "pr_agent:Добавляй, если PR добавляет новую функциональность"
[custom_labels."refactor"]
description = "pr_agent:Добавляй, если PR меняет структуру кода без изменения поведения"
[custom_labels."ui"]
description = "pr_agent:Добавляй, если PR меняет стили, вёрстку или компоненты интерфейса"