name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devio
          POSTGRES_PASSWORD: devio
          POSTGRES_DB: devio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: pytest
        working-directory: backend
        env:
          SECRET_KEY: test-secret-not-real
          DATABASE_URL: postgresql+asyncpg://devio:devio@localhost:5432/devio_test
