name: PR Size

on: pull_request

jobs:
  size:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size:XS"
          xs_max_size: "20"
          s_label: "size:S"
          s_max_size: "100"
          m_label: "size:M"
          m_max_size: "400"
          l_label: "size:L"
          l_max_size: "1000"
          xl_label: "size:XL"
          files_to_ignore: "package-lock.json *.d.ts"