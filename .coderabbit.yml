language: 'ru'

reviews:
  pre_merge_checks:
    docstrings:
      mode: 'off'
  suggested_labels: true
  auto_apply_labels: true
  path_filters:
    - '!package-lock.json'
    - '!**/api.d.ts'
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  auto_title_placeholder: '@coderabbitai'
  labeling_instructions:
    - label: 'area:backend'
      instructions: 'Ставь, если изменены файлы в backend/'
    - label: 'area:frontend'
      instructions: 'Ставь, если изменены файлы в frontend/'
    - label: 'bug-fix'
      instructions: 'PR исправляет некорректное поведение или баг'
    - label: 'ui'
      instructions: 'PR меняет внешний вид: стили, вёрстку, компоненты'
    - label: 'refactor'
      instructions: 'PR меняет структуру кода без изменения поведения'
